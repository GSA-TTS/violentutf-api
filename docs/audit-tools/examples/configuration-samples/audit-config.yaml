# Main audit configuration template
database:
  primary:
    url: "${DATABASE_URL}"
    pool_size: 10
    timeout: 30

inventory:
  include_schemas: ["public", "audit"]
  exclude_tables: ["temp_*", "cache_*"]
  classify_sensitive_data: true

output:
  format: ["json", "html"]
  destination: "./audit-reports"
  retention_days: 90

logging:
  level: INFO
  format: "%(asctime)s - %(levelname)s - %(message)s"
